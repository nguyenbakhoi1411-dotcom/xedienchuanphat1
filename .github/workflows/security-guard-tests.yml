name: Security Guard Tests

on:
  push:
    branches:
      - security-role-guard-split
  pull_request:
    paths:
      - "pom.xml"
      - "src/main/java/**"
      - "src/main/resources/**"
      - "src/test/java/com/chuanphat/warranty/security/**"
      - "src/test/java/com/chuanphat/warranty/PostgresIntegrationTest.java"
      - ".github/workflows/security-guard-tests.yml"
  workflow_dispatch:

jobs:
  security-guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Show Docker version
        run: docker version

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run security guard tests
        shell: bash
        run: |
          set +e
          ./mvnw "-Dtest=SecurityAnnotationTest,ProductFieldSecurityTest" test
          status=$?
          if [ "$status" -ne 0 ] && [ -d target/surefire-reports ]; then
            echo "::group::Surefire failure reports"
            find target/surefire-reports -maxdepth 1 -type f -name "*.txt" -print -exec sed -n '1,220p' {} \;
            echo "::endgroup::"
            report="$(find target/surefire-reports -maxdepth 1 -type f -name "*.txt" -print -quit)"
            if [ -n "$report" ]; then
              message="$(sed -n '1,120p' "$report" | python3 -c "import sys; s=sys.stdin.read(); print(s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))")"
              echo "::error title=Surefire failure report::$message"
            fi
          fi
          exit "$status"

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-security-guard-tests
          path: target/surefire-reports/

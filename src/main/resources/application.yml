spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}

app:
  ai:
    enabled: ${AI_ENABLED:false}
    mode: ${AI_MODE:mock}
  operations:
    backup-dir: ${BACKUP_DIR:backups}
    pg-dump-path: ${PG_DUMP_PATH:pg_dump}
    pg-restore-path: ${PG_RESTORE_PATH:pg_restore}
    app-version: ${APP_VERSION:0.0.1-SNAPSHOT}
    build-time: ${BUILD_TIME:local}
  mail:
    enabled: ${MAIL_ENABLED:false}
  security:
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      phone: ${BOOTSTRAP_ADMIN_PHONE:}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:}
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    password-reset:
      expose-token: ${EXPOSE_RESET_TOKEN:false}
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
    branch-strict-mode: ${BRANCH_STRICT_MODE:false}
    jwt:
      secret: ${JWT_SECRET:}
      access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}

# ============================================================
# Production Profile — PostgreSQL, Flyway migration, validate only
# Chạy: SPRING_PROFILES_ACTIVE=prod java -jar *.jar
# Bắt buộc đặt đầy đủ env vars bên dưới trước khi deploy
# ============================================================
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
  jpa:
    hibernate:
      # validate: KHÔNG tự động thay đổi schema — dùng Flyway để migrate
      ddl-auto: validate
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
  sql:
    init:
      # Production KHÔNG seed dữ liệu từ SQL file
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
  h2:
    console:
      # H2 console PHẢI TẮT ở production
      enabled: false

server:
  tomcat:
    max-threads: ${TOMCAT_MAX_THREADS:200}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}

app:
  ai:
    enabled: ${AI_ENABLED:false}
    mode: ${AI_MODE:disabled}
  security:
    bootstrap-admin:
      # Production: mặc định TẮT — chỉ bật tạm thời khi khởi tạo hệ thống lần đầu
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    cors:
      # Production: chỉ cho phép domain chính thức
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}
    login-rate-limit:
      # Production: giới hạn chặt hơn
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}
    branch-strict-mode: ${BRANCH_STRICT_MODE:true}
    password-reset:
      expose-token: ${EXPOSE_RESET_TOKEN:false}
    jwt:
      # BẮTBUỘC đặt JWT_SECRET (≥ 64 ký tự ngẫu nhiên) qua env
      secret: ${JWT_SECRET}
      access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
